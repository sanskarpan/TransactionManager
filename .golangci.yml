# golangci-lint config for the Transaction Manager.
# Zero-warning policy: every issue is fixed, not suppressed. The
# exceptions below are narrowly scoped, intentional discards.
version: "2"
run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - bodyclose
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
  exclusions:
    paths:
      - web/node_modules
    rules:
      # Test helpers (require/assert) intentionally discard errors.
      - path: _test\.go
        text: 'Error return value of `(require|assert)\.[A-Za-z]+` is not checked'
        linters:
          - errcheck
      # E2e test intentionally discards Body.Close/Wait errors.
      - path: e2e_test\.go
        linters:
          - errcheck
      # Vendored third-party Go code — not part of this module.
      - path: web/node_modules/
        linters:
          - revive
      # Intentional type-assertion panics in concurrent-safe maps
      # (sync.Map.Load returns interface{}; the concrete type is guaranteed).
      - path: internal/lock/table\.go
        linters:
          - errcheck
      - path: internal/mvcc/store\.go
        linters:
          - errcheck
      # HTTP ResponseWriter.Write errors are intentionally discarded
      # (nothing meaningful to do if the client has disconnected).
      - path: api/helpers\.go
        text: 'Error return value of `\(\*encoding/json\.Encoder\)\.Encode` is not checked'
        linters:
          - errcheck
      - path: api/server\.go
        text: 'Error return value of `w\.Write` is not checked'
        linters:
          - errcheck
      - path: api/apiwire/middleware\.go
        text: 'Error return value of `w\.Write` is not checked'
        linters:
          - errcheck
      # benchmark/tpcb.go intentionally discards Abort/Commit errors
      # in the rollback path (error is already captured).
      - path: benchmark/tpcb\.go
        text: 'Error return value of `r\.mgr\.Abort` is not checked'
        linters:
          - errcheck
      - path: benchmark/tpcb\.go
        text: 'Error return value of `r\.mgr\.Commit` is not checked'
        linters:
          - errcheck
      # internal/scenario/scenarios.go intentionally discards errors
      # in test-scenario orchestration (failure is captured by the
      # scenario's result channel).
      - path: internal/scenario/scenarios\.go
        text: 'Error return value of `mgr\.(Begin|Abort|Commit|MVCCWrite|MVCCRead|MVCCScan|TwoPLWrite|TwoPLRead|TwoPLScan)` is not checked'
        linters:
          - errcheck
      # internal/handlers_scenario.go: protocol/isolation parsing with defaults.
      - path: api/handlers_scenario\.go
        text: 'Error return value is not checked'
        linters:
          - errcheck
      # Type-assertion panics in test files (intentional, known types).
      - path: _test\.go
        text: 'Error return value is not checked'
        linters:
          - errcheck
      # Regression/SSI/gap_lock tests: intentional error discard.
      - path: _test\.go
        text: 'Error return value of `mgr\.(Begin|Abort|Commit|MVCCWrite|MVCCRead|TwoPLWrite|TwoPLRead|CreateSavepoint)` is not checked'
        linters:
          - errcheck

      # internal/raft: intentional error discards in cleanup paths (Close on error
      # path, Remove of temp files, Append in leader noop, persistState) and
      # type assertions on atomic.Value.Load() where the stored type is known.
      # hugeParam/rangeValCopy for Entry (128B) are pre-existing structural choices.
      # RaftLog name, comment formats, and exported-const comments are pre-existing.
      - path: internal/raft/
        linters:
          - errcheck
          - gocritic
          - revive
      # internal/storage: cleanup-path discards, hugeParam, unnamedResult, and
      # unexported-return (frame type) are pre-existing structural choices.
      - path: internal/storage/
        linters:
          - errcheck
          - gocritic
          - revive
      # internal/wal: cleanup-path discards, hugeParam, paramTypeCombine, stutter
      # (WALWriter), package-comment, and exported-const comments are pre-existing.
      - path: internal/wal/
        linters:
          - errcheck
          - gocritic
          - revive
      # internal/txn/manager.go: WAL.Abort is best-effort in the abort path;
      # the abort itself has already succeeded before the WAL write.
      - path: internal/txn/manager\.go
        text: 'Error return value of `m\.WAL\.Abort` is not checked'
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
