# golangci-lint config for the Transaction Manager.
# Zero-warning policy: every issue is fixed, not suppressed. The
# errcheck exclusion is narrowly scoped to testify helper call sites
# (require.X / assert.X) where the returned error is intentionally
# discarded; broader exclusions mask real resource leaks (H-07-style
# bugs in tests) and are explicitly avoided (L-INF-18).
version: "2"
run:
  timeout: 5m
  tests: true
  # web/node_modules ships vendored Go (e.g. flatted) that is not part of
  # this module's surface; linting it produces dozens of third-party
  # issues (L-INF-9). Skipped here.
  skip-dirs:
    - web/node_modules

linters:
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet
    - ineffassign    # ineffectual assignments
    - staticcheck    # the staticcheck suite
    - unused         # unused code
    - misspell        # comment / string typos
    - revive        # style checks (replaces golint)
    - gocritic       # common bug / perf patterns
    - bodyclose      # http.Response.Body leaks

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Narrow: only errcheck exemptions for testify helper calls in tests,
    # not a blanket _test.go exclusion. Unchecked http.Response.Body.Close
    # and similar leaks in tests are deliberately NOT exempted.
    - path: _test\.go
      text: 'Error return value of `(require|assert)\.[A-Za-z]+` is not checked'
      linters:
        - errcheck
    # Vendored third-party Go code — not part of this module.
    - path: web/node_modules/
      linters:
        - revive
    # E2e test intentionally discards Body.Close/Wait errors.
    - path: e2e_test\.go
      linters:
        - errcheck
